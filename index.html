/* IT games: playful purple arcade theme */
:root{color-scheme:dark;--bg:#4b167c;--panel:#6726a0;--panel2:#8038b5;--line:#263f91;--muted:#d9d7ff;--text:#ffffff;--purple:#263f91;--cyan:#ffffff;--pink:#263f91}
body{background:radial-gradient(ellipse at 50% -15%,#a83ee0 0,transparent 42%),linear-gradient(160deg,#40116e,#5d168a 55%,#32105b);color:var(--text);font-family:"Comic Sans MS","Chalkboard SE",cursive;}
.shell{max-width:1500px;padding:0 22px}
.topbar{height:0;overflow:visible;border:0;position:relative;z-index:2}
.brand{position:absolute;left:50%;top:24px;transform:translateX(-50%);gap:18px;font-family:"Comic Sans MS","Chalkboard SE",cursive;font-size:clamp(44px,8vw,100px);font-weight:900;letter-spacing:1px;white-space:nowrap;filter:drop-shadow(4px 5px 0 #2b0744)}
.brand .logo{display:none}.brand-it,.brand-games{color:#ffffff;text-shadow:3px 3px 0 #263f91,-2px -2px 0 #263f91,2px -2px 0 #263f91,-2px 2px 0 #263f91}
.topnote{display:none}.topbar #randomTop{position:absolute;right:0;top:14px;background:#263f91;color:#ffffff;border:3px solid #263f91;border-radius:18px;transform:rotate(2deg)}
.hero{display:block;text-align:center;padding:150px 0 25px;border-bottom:5px dashed #ff75c8;margin:0 -22px 28px;padding-left:22px;padding-right:22px;min-height:205px}
.hero-title-wrap h1{display:none;font-family:"Comic Sans MS","Chalkboard SE",cursive;font-size:clamp(54px,8vw,100px);line-height:1.08;letter-spacing:1px;margin:0;color:#ffffff;text-shadow:4px 4px 0 #32105b,-2px -2px 0 #32105b,2px -2px 0 #32105b,-2px 2px 0 #32105b;transform:rotate(-1deg)}
.hero-title-wrap h1 .grad{background:none;color:#ffffff;-webkit-text-fill-color:#ffffff;text-shadow:4px 4px 0 #263f91,-2px -2px 0 #263f91,2px -2px 0 #263f91,-2px 2px 0 #263f91}
.hero-title-wrap p{margin:12px auto 0;font-size:clamp(18px,2.5vw,27px);font-weight:700;color:#fff4ff}
.hero-art{display:none}.eyebrow{display:none}
.searchrow{margin-top:24px}.searchbox{background:#35105a;border:3px solid #8dfff0;border-radius:18px;color:#fff4ff;box-shadow:5px 5px 0 #260743}.searchbox input{color:#fff4ff;font-family:inherit}.searchbox input::placeholder{color:#e0b5f7}.searchbox svg{color:#ffffff}
.btn,.btn.primary{border:3px solid #263f91;border-radius:16px;background:#263f91;color:#ffffff;box-shadow:4px 4px 0 #260743;font-family:inherit;font-weight:900}.btn:hover{background:#263f91;transform:translateY(-2px) rotate(-1deg)}.btn.primary{background:#263f91;color:#ffffff}
.sectionhead,.tabs{font-family:inherit}.sectiontitle{font-size:24px;letter-spacing:0;color:#ffffff}.tab{border:2px solid #e5a8ff;border-radius:14px;color:#fff4ff;background:#6726a0}.tab.active{background:#263f91;color:#ffffff;border-color:#ffffff}.count{color:#f0caff}
.grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:17px 15px}.game{border:3px solid #e5a8ff;border-radius:16px;background:#6726a0;box-shadow:4px 4px 0 #260743}.cover{background:linear-gradient(135deg,#9a38c7,#4b167c)}.game:hover,.game:focus-visible{transform:translateY(-4px) rotate(.5deg);border-color:#ffffff;box-shadow:5px 7px 0 #260743}.gameinfo{color:#fff4ff}.game-meta,.footer{color:#f0caff}.tag:before{background:#263f91}.fav{background:#4b167c;color:#ffffff;border-color:#e5a8ff}.fav.on{color:#ff75c8;background:#35105a}.modal{background:#220735dd}.modalbox{background:#35105a;border:3px solid #ff75c8;border-radius:18px}.modalhead{font-family:inherit;border-color:#8038b5}.modalhead .btn{height:36px}.framewrap,.framewrap iframe{background:#210633}.footer{border-color:#e5a8ff}
@media(max-width:850px){.brand{top:20px;font-size:clamp(35px,7vw,64px);gap:12px}.topbar #randomTop{top:6px}.hero{padding-top:112px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:600px){.brand{top:12px;font-size:clamp(30px,8vw,48px);gap:10px}.topbar #randomTop{display:none}.hero{padding-top:85px;min-height:0}.hero-title-wrap h1{font-size:clamp(43px,12vw,64px)}.hero-title-wrap p{font-size:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.searchrow{align-items:stretch}.searchrow .btn{white-space:normal}}

</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><span class="brand-it">IT</span><span class="brand-games">games</span></div><div class="topnote">A little break. A lot of games.</div><button class="btn" id="randomTop" title="Pick a random game">✦ <span>Surprise me</span></button></header>
<section class="hero"><div class="hero-title-wrap"><h1>IT <span class="grad">games</span></h1><p>packed with 2,038 games*</p></div><div class="hero-art" aria-hidden="true"><div class="tile">👾</div><div class="tile">🎮</div><div class="tile">🕹️</div></div></section>
<div class="searchrow"><label class="searchbox" for="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7.5"/><path d="m16.5 16.5 4 4"/></svg><input id="search" type="search" placeholder="Search 2,000+ games..." autocomplete="off"><span class="keyhint">/</span></label><button class="btn primary" id="randomBtn">✦ Random game</button></div>
<div class="sectionhead"><div class="sectiontitle" id="sectionTitle">✦ Explore games <small id="shownCount"></small></div><div class="count" id="resultCount">Loading games…</div></div>
<div class="tabs" role="tablist" aria-label="Game filters" style="margin:-2px 0 18px"><button class="tab active" data-filter="all">All games</button><button class="tab" data-filter="favorites">♥ Favorites</button><button class="tab" data-filter="recent">◷ Recently played</button></div>
<main><div class="grid" id="grid" aria-live="polite"><div class="empty"><strong>Loading the arcade…</strong>Getting the games ready.</div></div><div class="loadrow"><button class="btn" id="loadMore" hidden>Load more games ↓</button></div></main>
<footer class="footer"><span>✦ IT games — play something fun!</span><span>Favorites are saved on this device. Game availability may vary.</span></footer>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Game player"><div class="modalbox"><div class="modalhead"><button class="btn" id="backBtn">← Back</button><div class="modalname" id="modalName">Game</div><button class="btn" id="openNew">↗ New tab</button><button class="btn" id="fullscreen">⛶ Fullscreen</button><button class="btn" id="closeModal" aria-label="Close game">✕</button></div><div class="framewrap"><iframe id="player" title="Game player" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen referrerpolicy="no-referrer"></iframe></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s);const grid=$('#grid'),search=$('#search'),count=$('#resultCount'),shown=$('#shownCount'),loadMore=$('#loadMore'),modal=$('#modal'),player=$('#player');let games=[],filter='all',query='',visible=60,currentGame=null;const favs=new Set(readStore('arcade-favorites',[])),recent=readStore('arcade-recent',[]);function readStore(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}function saveStore(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2200)}function filtered(){let a=games;if(filter==='favorites')a=a.filter(g=>favs.has(g.url));if(filter==='recent')a=a.filter(g=>recent.includes(g.url)).sort((x,y)=>recent.indexOf(x.url)-recent.indexOf(y.url));if(query){const q=query.toLowerCase();a=a.filter(g=>g.name.toLowerCase().includes(q))}return a}function render(reset=false){if(reset)visible=60;const all=filtered(),items=all.slice(0,visible);count.textContent=`${all.length.toLocaleString()} ${all.length===1?'game':'games'}`;shown.textContent=query?'matching your search':'';loadMore.hidden=items.length>=all.length;if(!items.length){grid.innerHTML=`<div class="empty"><strong>${filter==='favorites'?'No favorites yet':filter==='recent'?'No recently played games':'No games found'}</strong>${filter==='favorites'?'Tap the ♥ on any game to save it here.':'Try another search, or switch back to all games.'}</div>`;return}grid.innerHTML=items.map((g,i)=>`<article class="game" tabindex="0" role="button" data-index="${games.indexOf(g)}" aria-label="Play ${escapeHTML(g.name)}"><div class="cover">${g.thumbnail?`<img loading="lazy" src="${escapeHTML(g.thumbnail)}" alt="" onerror="this.remove();this.parentNode.insertAdjacentHTML('afterbegin','<span class=&quot;fallback&quot;>🎮</span>')">`:'<span class="fallback">🎮</span>'}<span class="playbadge">▶</span><button class="fav ${favs.has(g.url)?'on':''}" data-fav="${games.indexOf(g)}" aria-label="${favs.has(g.url)?'Remove from':'Add to'} favorites" title="Favorite">${favs.has(g.url)?'♥':'♡'}</button></div><div class="gameinfo"><div class="gamename" title="${escapeHTML(g.name)}">${escapeHTML(g.name||'Untitled game')}</div><div class="game-meta"><span class="tag">Browser game</span><span>${favs.has(g.url)?'♥ Saved':'▶ Play'}</span></div></div></article>`).join('')}
function play(g){if(!g)return;currentGame=g;$('#modalName').textContent=g.name;player.src='about:blank';modal.classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>{player.src=g.url},50);const idx=recent.indexOf(g.url);if(idx>=0)recent.splice(idx,1);recent.unshift(g.url);recent.splice(30);saveStore('arcade-recent',recent);if(filter==='recent')render(true)}function close(){modal.classList.remove('open');document.body.style.overflow='';player.src='about:blank';currentGame=null}function random(){const list=filtered().filter(g=>g.url);play(list[Math.floor(Math.random()*list.length)])}grid.addEventListener('click',e=>{const fav=e.target.closest('[data-fav]');if(fav){e.stopPropagation();const g=games[Number(fav.dataset.fav)];if(favs.has(g.url))favs.delete(g.url);else favs.add(g.url);saveStore('arcade-favorites',[...favs]);render();return}const card=e.target.closest('.game');if(card)play(games[Number(card.dataset.index)])});grid.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('game')){e.preventDefault();play(games[Number(e.target.dataset.index)])}});search.addEventListener('input',()=>{query=search.value.trim();render(true)});document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));$('#sectionTitle').childNodes[0].textContent=filter==='favorites'?'♥ Your favorites':filter==='recent'?'◷ Recently played':'✦ Explore games';render(true)}));loadMore.addEventListener('click',()=>{visible+=60;render()});$('#randomBtn').addEventListener('click',random);$('#randomTop').addEventListener('click',random);$('#closeModal').addEventListener('click',close);$('#backBtn').addEventListener('click',close);$('#openNew').addEventListener('click',()=>{if(currentGame)window.open(currentGame.url,'_blank','noopener,noreferrer')});$('#fullscreen').addEventListener('click',()=>{const el=player;try{if(document.fullscreenElement)document.exitFullscreen();else el.requestFullscreen?.()}catch{toast('Fullscreen is not available in this browser.')}});modal.addEventListener('click',e=>{if(e.target===modal)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))close();if(e.key==='/'&&!modal.classList.contains('open')&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();search.focus()}});fetch('./games.json').then(r=>{if(!r.ok)throw Error('Could not load games.json');return r.json()}).then(data=>{games=Array.isArray(data)?data:(data.games||[]);games=games.filter(g=>g&&g.name&&g.url).map(g=>{let url=String(g.url);for(const base of ['https://cdn.jsdelivr.net/gh/gn-math/html@main/','https://cdn.jsdelivr.net/gh/freebuisness/html@main/']){if(url.startsWith(base)){url='https://raw.githack.com/nprgaming/gn-math-html/main/'+url.slice(base.length);break}}return {...g,url,thumbnail:typeof g.thumbnail==='string'?g.thumbnail.replace('https://cdn.jsdelivr.net/gh/gn-math/covers@main/','https://cdn.jsdelivr.net/gh/freebuisness/covers@main/'):g.thumbnail}});render(true)}).catch(()=>{grid.innerHTML='<div class="empty"><strong>Could not load the game collection.</strong>Make sure index.html and games.json are in the same folder and open the site through a local web server.</div>';count.textContent='Load error'})})();
</script>
</body></html>
